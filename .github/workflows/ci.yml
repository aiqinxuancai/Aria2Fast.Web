name: Build and verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet build -c Release
      - run: dotnet run --project tests/Aria2Fast.Web.Tests -c Release --no-build
      - run: python tests/integration.py
      - run: npm install --no-audit --no-fund
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: node tests/browser/smoke.cjs
      - name: Install real download engine
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Publish isolated application
        run: dotnet publish src/Aria2Fast.Web -c Release --self-contained false -o artifacts/ci-publish
      - name: Verify real engine through API and mobile browser
        env:
          TEST_PUBLISH_DIR: ${{ github.workspace }}/artifacts/ci-publish
        run: |
          python tests/integration.py --real-aria
          python tests/local_tuning.py
          python tests/real_downloads.py
          node tests/browser/real.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/screenshots/
            artifacts/real-*-results.json
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aria2fast:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify bundled aria2 and authenticated application
        shell: bash
        run: |
          docker run --rm --entrypoint aria2c aria2fast:test --version
          docker run -d --name smoke -p 18080:8080 -e ARIA2FAST_PASSWORD=ci-test-password-2026 aria2fast:test
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:18080/healthz && break; sleep 2; done
          curl -fsS -c /tmp/cookies -H 'X-Aria2Fast: 1' -H 'Content-Type: application/json' -d '{"password":"ci-test-password-2026"}' http://localhost:18080/api/auth/login
          curl -fsS -b /tmp/cookies -H 'X-Aria2Fast: 1' -X POST http://localhost:18080/api/nodes/local/test
          curl -fsS -b /tmp/cookies http://localhost:18080/api/tasks
