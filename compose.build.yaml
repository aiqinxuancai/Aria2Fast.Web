# Optional source build: docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  aria2fast:
    image: aria2fast-web:local
    build:
      context: .
      args:
        # true adds ffmpeg, so the media library can remux and transcode videos browsers cannot play.
        WITH_FFMPEG: ${ARIA2FAST_WITH_FFMPEG:-false}
    pull_policy: build
