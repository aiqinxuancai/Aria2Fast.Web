services:
  aria2fast:
    image: ${ARIA2FAST_IMAGE:-ghcr.io/aiqinxuancai/aria2fast.web:latest}
    restart: unless-stopped
    ports:
      - "${ARIA2FAST_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      ARIA2FAST_PASSWORD: ${ARIA2FAST_PASSWORD:-}
    volumes:
      - app-data:/data
      - downloads:/downloads
    stop_grace_period: 30s

volumes:
  app-data:
  downloads:
